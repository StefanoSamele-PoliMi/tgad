  new_description:
    bottle: A close-up view of a single bottle designed for quality control. The object should exhibit a smooth, uninterrupted
      round form with no visual indicators of wear, damage, or manufacturing errors. Is there any anomaly in the image?
    cable: Three distinct cables appear in this scene, each expected to lie in proper order. The inspection focuses on ensuring
      that none are missing, misplaced, or show visible surface damage like cuts or abrasions. Is there any anomaly in the
      image?
    capsule: Captured here is a pharmaceutical capsule featuring black and orange segments with the marking '500'. Any inconsistency
      in color, missing print, or physical deformity would indicate a defect. Is there any anomaly in the image?
    carpet: An area of carpet is shown, where attention should be given to texture uniformity and surface integrity. Defects
      like punctures, fiber disruptions, or irregular patterns are not acceptable. Is there any anomaly in the image?
    grid: This image highlights a metallic grid structure. Gaps, broken lines, or any visible structural inconsistencies would
      classify as anomalies during inspection. Is there any anomaly in the image?
    hazelnut: A single hazelnut rests at the center of this frame. Inspectors should check for a clean, unbroken shell with
      no cracks, holes, or discoloration that might signal a flaw. Is there any anomaly in the image?
    leather: A stretched piece of brown leather is displayed. Consistent surface texture and color are required; scratches,
      tears, or stains would signal an anomaly. Is there any anomaly in the image?
    metal_nut: The photograph shows a metal fastening nut. It should be oriented correctly, with its entire surface free from
      dents, scratches, missing edges, or other deformities. Is there any anomaly in the image?
    pill: This frame contains a single pill marked with 'FF' and decorated with red designs on a white background. Any smudging,
      shape distortion, or surface damage is considered a defect. Is there any anomaly in the image?
    screw: The focus here is on a single metal screw. Its pointed end must remain sharp, and no part of its surface should
      exhibit bends, scratches, or manufacturing errors. Is there any anomaly in the image?
    tile: A square tile is positioned at the center of this image. Inspectors are to look for surface consistency, with no
      chips, holes, or fractures present. Is there any anomaly in the image?
    toothbrush: Presented here is a toothbrush. Any broken bristles, cracks in the handle, missing parts, or visible marks
      would categorize it as defective. Is there any anomaly in the image?
    transistor: A small electronic transistor sits against a plain background. The pins must remain straight and intact, with
      no evidence of bending, scratches, or material loss. Is there any anomaly in the image?
    wood: This is a wooden surface sample. Natural grain patterns should appear uninterrupted, and no cuts, holes, color patches,
      or texture defects should exist. Is there any anomaly in the image?
    zipper: The subject here is a clothing zipper. Teeth alignment must be perfect, and no separations, broken segments, or
      material damage should appear along its length. Is there any anomaly in the image?
